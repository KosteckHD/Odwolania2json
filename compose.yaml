# KIOdczyt (Odwołania2JSON) — uruchomienie w Dockerze.
# Na serwerze oceny repozytorium leży bezpośrednio w /opt/solution (tam też input/, output/, .env i RUN.md).
#
#   docker compose build batch          # raz, przed oceną (obraz z zależnościami)
#   docker compose run --rm batch       # przetwarza input/ -> output/ i kończy się (komenda z RUN.md)
#   docker compose up -d api            # panel WWW na porcie 8000 (startuje sam po restarcie serwera)

x-model-env: &model-env
  # Konfiguracja modelu i klucz API z pliku .env obok tego pliku (wzór: .env.example).
  env_file:
    - path: .env
      required: false

services:
  batch:
    build: .
    image: kiodczyt:latest
    <<: *model-env
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
    restart: "no"

  api:
    build: .
    image: kiodczyt:latest
    <<: *model-env
    command: ["python", "-m", "uvicorn", "--app-dir", "src", "kio_extract.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
