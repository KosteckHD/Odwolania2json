id: przelew
schema: przelew.schema.json
classification:
  positive_patterns:
    - '(?im)^\s*(?:potwierdzenie\s+(?:(?:wykonania|realizacji|zlecenia)\s+)?(?:przelewu|transakcji|operacji)|dowód\s+przelewu)\b'
    - '(?im)^\s*data\s+(?:operacji|transakcji)\b'
    - '(?im)^\s*kwota\b'
    - '(?im)^\s*(?:rachunek(?:\s+(?:nadawcy|odbiorcy|obciążany))?|(?:z|na) rachun(?:ek|ku)|numer rachunku)\b'
  minimum_matches: 2
fields:
  przelew_bankowy.data_operacji:
    pattern: '(?im)^\s*data[ \t]+operacji[ \t:]*(?P<value>[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{1,2}[./-][0-9]{1,2}[./-][0-9]{4})\b'
    normalize: iso_date
  przelew_bankowy.kwota:
    pattern: '(?im)^\s*kwota[ \t:]*(?P<value>[0-9]+(?:[^\S\r\n][0-9]{3})*(?:[,.][0-9]{2})?)[^\S\r\n]*(?:PLN)?[^\S\r\n]*$'
    normalize: amount
