id: odwolanie
schema: odwolanie.schema.json
classification:
  positive_patterns:
    - '(?im)^\s*odwołanie(?:\s+do\s+(?:prezesa|krajowej).*)?\s*$'
    - '(?i)wnos(?:zę|imy)\s+(?:niniejsze\s+)?odwołanie'
    - '(?i)odwołujący\s*:'
    - '(?i)zamawiający\s*:'
  negative_patterns:
    - '(?im)^\s*(?:wyrok|postanowienie|odpowiedź na odwołanie|zgłoszenie przystąpienia)\b'
  minimum_matches: 2
options:
  czynnosc_powod_opisy:
    '1': Decyzja o odrzuceniu oferty
    '2': Ogłoszenie wyboru oferty
    '3': Decyzja o wykluczeniu wykonawcy
    '4': Publikacja specyfikacji warunków zamówienia (SWZ)
    '5': Modyfikacja treści SWZ
    '6': Odpowiedzi/wyjaśnienia do SWZ
    '7': Zaniechanie odrzucenia oferty
    '8': Zaniechanie wykluczenia wykonawcy
    '9': Decyzja o unieważnieniu postępowania
    '10': Zaniechanie unieważnienia postępowania
    '11': Opis przedmiotu zamówienia (OPZ)
    '12': Projektowane postanowienia umowy
postprocess:
  # Deterministyczne poprawki odpowiedzi modelu (src/kio_extract/postprocess.py).
  fill_missing:
    # Dzień czynności: jedyna data w zdaniu „Zamawiający w dniu <data> ...”.
    - field: OdwolanieKIO.czynnosc_dzien
      pattern: '(?i)zamawiający\s+w\s+dniu\s+(?P<value>[0-9]{1,2}\s+[a-ząćęłńóśźż]+\s+[0-9]{4}|[0-9]{1,2}[./-][0-9]{1,2}[./-][0-9]{4}|[0-9]{4}-[0-9]{2}-[0-9]{2})'
      normalize: iso_date
    # Kancelaria pełnomocnika: nazwa po „adres do korespondencji:” do przecinka przed adresem,
    # tylko gdy wygląda na kancelarię/spółkę prawników i model wskazał osobę pełnomocnika.
    - field: Odwolujacy[].pelnomocnik.nazwa
      pattern: '(?i)adres\s+do\s+korespondencji\s*:\s*(?P<value>(?=[^,@]{0,200}?(?:kancelari|adwokac|radc|prawn|partner|sp\.\s*[kp]\b))[^,@]{3,200}?)\s*,\s*(?:ul\.|al\.|pl\.|os\.|[0-9]{2}-[0-9]{3})'
      requires: ['Odwolujacy[].pelnomocnik.imie_nazwisko']
    # E-mail pełnomocnika: pierwszy adres e-mail po adresie do korespondencji (bez innego „@” po drodze).
    - field: Odwolujacy[].pelnomocnik.mail
      pattern: '(?i)adres\s+do\s+korespondencji\s*:[^@]{0,300}?(?<![\w.%+-])(?P<value>[\w.%+-]+@[\w-]+(?:\.[\w-]+)+)'
      requires: ['Odwolujacy[].pelnomocnik.imie_nazwisko']
  classify_by_patterns:
    # Powód zaskarżonej czynności z tekstu: fragmenty, w których odwołanie nazywa czynność
    # (zdanie „Zamawiający w dniu <data> …”, pierwszy punkt „polegających na: 1) …”,
    # „Zarzut nr 1 – …”, „zarzucam Zamawiającemu: 1) …”). Każdy fragment głosuje tylko,
    # gdy pasuje do dokładnie jednej klasy; model jest nadpisywany tylko, gdy wszystkie głosujące
    # fragmenty są zgodne (sprzeczne fragmenty = zostaje model). Kolejność klas = pierwszeństwo
    # („zaniechanie odrzucenia” przed „odrzuceniem”, „modyfikacja SWZ” przed „SWZ”).
    - field: OdwolanieKIO.czynnosc_powod_id
      min_votes: 1
      mode: override
      segments:
        - '(?i)zamawiający\s+w\s+dniu\s+(?:[0-9]{1,2}\s+[a-ząćęłńóśźż]+\s+[0-9]{4}|[0-9]{1,2}[./-][0-9]{1,2}[./-][0-9]{4}|[0-9]{4}-[0-9]{2}-[0-9]{2})\s*(?:r\.|roku)?\s*,?\s*(?P<segment>.{1,400}?)(?:\.\s+(?=(?-i:[A-ZĄĆĘŁŃÓŚŹŻ]))|\.?$)'
        - '(?i)polegając\w*\s+na\s*:?\s*(?:1\s*[).]\s*)?(?P<segment>.{1,300}?)(?:;|\s2\s*[).]\s)'
        - '(?i)zarzut\w*\s+(?:nr\s*)?1\b\s*[–—-]?\s*(?P<segment>[^:;]{1,250}?)(?:,?\s+tj\.|[:;])'
        - '(?i)zarzuca(?:m|my)?\s+zamawiającemu\s*:?\s*(?:1\s*[).]\s*)?(?P<segment>.{1,300}?)(?:;|\s2\s*[).]\s|\.\s)'
      classes:
        - value: 10
          patterns: ['(?i)zaniecha\w*\s+unieważnieni\w*', '(?i)\bnie\s+unieważni\w*']
        - value: 7
          patterns: ['(?i)zaniecha\w*\s+odrzuceni\w*', '(?i)\bnie\s+odrzuci\w*']
        - value: 8
          patterns: ['(?i)zaniecha\w*\s+wykluczeni\w*', '(?i)\bnie\s+wykluczy\w*']
        - value: 5
          patterns: ['(?i)(?:modyfikac\w*|zmodyfikow\w*|zmian\w*)\s+(?:treś(?:ć|ci)\s+)?(?:swz|specyfikacji\s+warunków\s+zamówienia)']
        - value: 6
          patterns:
            - '(?i)(?:odpowiedzi|wyjaśnie\w*)(?:\s+(?:i|oraz)\s+wyjaśnie\w*)?\s+(?:do\s+)?(?:treś(?:ć|ci)\s+)?(?:swz|specyfikacji\s+warunków\s+zamówienia)'
            - '(?i)odpowiedzi\w*\s+na\s+pytania'
        - value: 12
          patterns: ['(?i)projektowan\w*\s+(?:istotn\w*\s+)?postanowie\w*\s+umowy']
        - value: 11
          patterns: ['(?i)opis\w*\s+przedmiotu\s+zamówienia', '(?i)\bopz\b']
        - value: 4
          patterns: ['(?i)specyfikacj\w*\s+warunków\s+zamówienia', '(?i)\bswz\b']
        - value: 9
          patterns: ['(?i)unieważni\w*']
        - value: 3
          patterns: ['(?i)wyklucz\w*']
        - value: 1
          patterns: ['(?i)odrzuc\w*']
        - value: 2
          patterns: ['(?i)\bwyb(?:ór|oru|orze|rał\w*|ierając\w*)\b', '(?i)najkorzystniejsz\w*']
  derive:
    # Opis powodu zawsze ze słownika options.czynnosc_powod_opisy (1:1 z czynnosc_powod_id).
    - field: OdwolanieKIO.czynnosc_opis
      source: OdwolanieKIO.czynnosc_powod_id
      option: czynnosc_powod_opisy
  # Imię i nazwisko w pisowni z dokumentu (diakrytyki, końcówka rodzaju), gdy model ją zmienił.
  snap_to_text:
    - 'Odwolujacy[].pelnomocnik.imie_nazwisko'
  # Prowadzący postępowanie ma sens tylko przy kilku zamawiających; przy jednym null.
  null_when_single:
    - 'Zamawiajacy[].prowadzacy_postepowanie'
  # Przy kilku zamawiających: 0 dla tych, których pismo nie wskazuje jako prowadzącego.
  default_when_multiple:
    'Zamawiajacy[].prowadzacy_postepowanie': 0
  # Numer BZP musi stać w piśmie (model potrafi przerobić stary numer „594737-N-2020” na nowy format).
  require_in_text:
    - 'ZamowieniePubliczne.numer_bzp'
  # Stary krajowy numer ogłoszenia („522996-N-2020”) to nie TED, także gdy model usunie „-N”.
  null_if_text_matches:
    - field: ZamowieniePubliczne.numer_ted
      pattern: '(?P<numer>[0-9]{6})\s*-\s*N\s*-\s*(?P<rok>[0-9]{4})'
      equals: '{numer}-{rok}'
